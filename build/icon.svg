<!--
  App icon: the Steam mark in white on a black tile.

  Valve's Steam logo is their trademark. It is used here as the icon of a
  personal, non-commercial tool for browsing your own Steam captures; it would
  need replacing before distributing this publicly or commercially.

  The glyph is knocked out of the disc with a mask, so the same geometry works
  in the app UI at any colour (see the brand marks in src/renderer/index.html).

  Rasterised into build/icon.ico by tools/make-icon.js.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <mask id="steamGlyph">
      <!-- white = kept, black = cut away -->
      <circle cx="128" cy="128" r="102" fill="#fff"/>

      <!-- connecting rod, valve wheel down to piston head -->
      <polygon points="148.1,81.2 182.5,114.6 113.4,178.5 86.2,152.1" fill="#000"/>
      <!-- tail, piston head out to the rim -->
      <polygon points="105.2,147.1 94.4,183.5 26.2,145.9 27.6,141.1" fill="#000"/>

      <!-- valve wheel: ring inside a ring -->
      <circle cx="165.3" cy="97.9" r="32.8" fill="#000"/>
      <circle cx="165.3" cy="97.9" r="23.7" fill="#fff"/>
      <circle cx="165.3" cy="97.9" r="17.3" fill="#000"/>

      <!-- piston head -->
      <circle cx="99.8" cy="165.3" r="25.5" fill="#000"/>
      <circle cx="99.8" cy="165.3" r="15.5" fill="#fff"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="58" fill="#000000"/>
  <rect width="256" height="256" fill="#ffffff" mask="url(#steamGlyph)"/>
</svg>
